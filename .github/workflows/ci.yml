name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load toolchain versions
        working-directory: ${{ github.workspace }}
        run: grep -v '^#' .github/versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: server
          install-only: true
          verify: true

      - name: go fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "OK: gofmt clean"

      - name: golangci-lint fmt
        run: |
          diff=$(golangci-lint fmt -d ./...)
          if [ -n "$diff" ]; then
            echo "The following formatting changes are required (golangci-lint fmt):" >&2
            echo "$diff" >&2
            exit 1
          fi
          echo "OK: golangci-lint fmt clean"

      - name: golangci-lint run
        run: golangci-lint run ./...

  test:
    name: Race Tests & Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load toolchain versions
        run: grep -v '^#' .github/versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Run unit tests with race detector
        run: make test

      - name: Enforce coverage gate
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml

      - name: Coverage summary
        if: always() && steps.coverage.outputs.total-coverage != ''
        run: |
          {
            echo "### Coverage"
            echo
            echo "${{ steps.coverage.outputs.total-coverage }}% · floor 70%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore benchmark history
        uses: actions/cache/restore@v6
        with:
          path: .cache/benchmark
          key: go-bench-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-bench-

      - name: Run memory and throughput benchmarks
        id: bench
        run: |
          mkdir -p .cache/benchmark
          # Cache miss on the first run. The benchmark action warns if this file is absent.
          if [ ! -s .cache/benchmark/data.json ]; then
            printf '%s\n' '{"lastUpdate":0,"repoUrl":"","entries":{}}' > .cache/benchmark/data.json
          fi
          make bench
          # The action scores every Go unit as smaller-is-better. MB/s is throughput,
          # so a faster run looks like a regression and trips the 200% alert.
          # ns/op, B/op, and allocs/op stay.
          sed -Ei 's/[[:space:]]+[0-9.]+[[:space:]]+MB\/s//g' server/bench.txt
          # The benchmark action prints a comparison only when this file already has entries.
          if grep -Eq '"entries"[[:space:]]*:[[:space:]]*\{\}' .cache/benchmark/data.json; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go benchmarks
          tool: go
          output-file-path: server/bench.txt
          external-data-json-path: .cache/benchmark/data.json
          github-token: ${{ github.token }}
          skip-fetch-gh-pages: true
          alert-threshold: "200%"
          # 200ms benches on a shared runner cross 200% with no code change.
          # The comparison still lands in the job summary. A PR comment uses
          # pull-requests:write. A push to master has no PR, and the commit
          # comment API needs contents:write — that 403 fails the job.
          fail-on-alert: false
          comment-always: ${{ github.event_name == 'pull_request' }}
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          summary-always: true

      - name: Benchmark summary
        if: steps.bench.outputs.fresh == 'true'
        run: |
          {
            echo "### Benchmarks"
            echo
            echo '```'
            grep '^Benchmark' server/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark history
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .cache/benchmark
          key: go-bench-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload coverage and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-bench-reports
          path: |
            server/coverage.out
            server/bench.txt
          retention-days: 14
          if-no-files-found: ignore

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config .goreleaser.yaml

      - name: Validate .goreleaser.local.yaml
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config .goreleaser.local.yaml

  web-check:
    name: Web checks (typecheck lint i18n)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: i18n
        run: yarn i18n:check

  web-unit:
    name: Web unit tests (vitest, coverage floor)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Fails when coverage drops below test.coverage.thresholds in web/vite.config.ts.
      - name: Test
        run: yarn test --coverage

      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const p = (k) => t[k].pct.toFixed(1) + '%';
            console.log('### Web coverage (floors enforced by vite.config.ts)\n');
            console.log('| statements | branches | functions | lines |');
            console.log('|---|---|---|---|');
            console.log('| ' + ['statements', 'branches', 'functions', 'lines'].map(p).join(' | ') + ' |');
          " >> "$GITHUB_STEP_SUMMARY"

  web-e2e:
    name: Web E2E (mocked) and build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The browser download is keyed by the lockfile (it pins the Playwright version).
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/yarn.lock') }}

      # Still installs the system libraries when the browser itself came from the cache.
      - name: Install Playwright Chromium
        run: yarn playwright install chromium --with-deps

      - name: E2E (mocked)
        run: yarn test:e2e

      - name: Build
        run: yarn build
        env:
          # Ensure release-like embed build (no localhost API baked in)
          VITE_SERVER_HOST: ""

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-mock-artifacts
          path: web/e2e/.artifacts
          if-no-files-found: ignore

  # Single required status for the web UI. Keeps the historical job name so branch protection
  # keeps working while the work above runs in parallel.
  web:
    name: Web (typecheck lint test build)
    runs-on: ubuntu-26.04
    needs: [web-check, web-unit, web-e2e]
    if: always()
    steps:
      - name: All web jobs passed
        run: |
          echo "web-check: ${{ needs.web-check.result }}"
          echo "web-unit: ${{ needs.web-unit.result }}"
          echo "web-e2e: ${{ needs.web-e2e.result }}"
          test "${{ needs.web-check.result }}" = success
          test "${{ needs.web-unit.result }}" = success
          test "${{ needs.web-e2e.result }}" = success

  e2e-changes:
    name: E2E paths filter
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      real: ${{ steps.filter.outputs.real }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            real:
              - 'web/src/**'
              - 'web/e2e/**'
              - 'web/playwright.config.ts'
              - 'web/package.json'
              - 'server/web/**'
              - 'server/torr/**'
              - 'server/settings/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  e2e-real:
    name: E2E (real server)
    needs: e2e-changes
    if: needs.e2e-changes.outputs.real == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Advisory until the suite has a track record on shared runners.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load toolchain versions
        run: grep -v '^#' .github/versions.env >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium and ffmpeg
        working-directory: web
        run: |
          yarn playwright install chromium --with-deps
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build binaries and run suite
        run: make e2e-real
        env:
          VITE_SERVER_HOST: ""

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-artifacts
          path: web/e2e/.artifacts
          if-no-files-found: ignore

  build:
    name: Build (linux amd64)
    runs-on: ubuntu-22.04
    needs: [lint, test, goreleaser-check, web]
    env:
      VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load toolchain versions
        run: grep -v '^#' .github/versions.env >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install Go toolchain wrapper (GoReleaser tool)
        run: |
          go install golang.org/dl/go${{ env.GO_VERSION }}@latest
          go${{ env.GO_VERSION }} download

      - name: Snapshot build (single target, no docker)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target --id binary
        env:
          GO_BINARY: go${{ env.GO_VERSION }}
          UPX_ENABLED: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify binary artifact
        run: test -x dist/TorrServer-linux-amd64

      - name: Verify static Linux binary (no shared libs)
        run: |
          bin=dist/TorrServer-linux-amd64
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "Expected a statically linked binary without DT_NEEDED entries:" >&2
            readelf -d "$bin" | grep NEEDED >&2 || true
            exit 1
          fi
          echo "OK: no dynamic library dependencies"
