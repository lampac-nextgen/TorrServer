        try {
          var scheme = localStorage.getItem('ts-color-scheme')
          var palette = localStorage.getItem('ts-color-palette')
          var root = document.documentElement
          var dark = scheme === 'dark' || (scheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          if (palette && ALIASES[palette]) palette = ALIASES[palette]
          if (palette && /^[a-z]+$/.test(palette)) root.dataset.palette = palette
          if (palette && HEADERS[palette]) {
            // The static, media-scoped tags below are the fallback; one unscoped tag follows the user's choice.
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) {
              el.remove()
            })
            var meta = document.createElement('meta')
            meta.id = 'ts-theme-color'
            meta.name = 'theme-color'
            meta.content = HEADERS[palette][dark ? 1 : 0]
            document.head.appendChild(meta)
          }
        } catch (e) {
          /* storage unavailable: the app falls back to the default palette */
        }
      })()
    </script>
